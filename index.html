<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Raman</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="font-mono">

    <header>
        <h1 class="font-mono text-2xl font-bold mx-px m-5" > My Todolist</h1>
    </header>


    <main>
        <section>
            <form>

                <input type="text" class="border p-2 rounded" id="todo-input" placeholder="Enter a New Todo">

                <input type="date" class="border p-2 rounded" id="todo-input">

            </form>

            <button type="button" class="border p-2 rounded mx-px m-2 bg-stone-950 text-white">Add Todo</button>


        </section>

        <section>
            <button class="border p-2 rounded mr-28 bg-stone-950 text-white">Clear All Todos</button>

            <button class="border p-2 rounded bg-stone-950 text-white">Filter Todos</button>
        </section>

        <section>
            <header>
                <h1 class="mx-px m-5 text-center font-bold">List Of Todos</h1>
            </header>

            <ul>
                <li>No Todos Available</li>
            </ul>
        </section>
    </main>


    <footer>

        <p>&copy; 2025 Raman. All right reserved</p>
    </footer>
    

    <script src="js/script.js"></script>
</body>
</html>
